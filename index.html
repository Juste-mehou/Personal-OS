<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Personal OS</title>
<style>*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg:#ffffff; --bg2:#f5f4f0; --bg3:#eeece6;
    --text:#1a1917; --text2:#6b6960; --text3:#9c9a92;
    --border:rgba(0,0,0,0.10); --border2:rgba(0,0,0,0.18);
    --rad:8px; --rad-lg:12px;
    --font:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    --blue:#378ADD; --blue-bg:#E6F1FB; --blue-tc:#0C447C;
    --red:#C04828; --red-bg:#FAECE7; --red-tc:#712B13;
    --green:#1D9E75; --green-bg:#E1F5EE; --green-tc:#085041;
    --gray:#888780; --gray-bg:#F1EFE8; --gray-tc:#444441;
    --ok:#085041; --ok-bg:#E1F5EE;
    --warn-bg:#FEF7E0; --warn-tc:#7A5200; --warn-bd:#F0D070;
  }
  @media (prefers-color-scheme:dark){:root{
    --bg:#1c1b18; --bg2:#242320; --bg3:#2c2b27;
    --text:#e8e6df; --text2:#a09e96; --text3:#6b6960;
    --border:rgba(255,255,255,0.10); --border2:rgba(255,255,255,0.18);
    --blue-bg:#0a2540; --blue-tc:#B5D4F4;
    --red-bg:#3d1408; --red-tc:#F5C4B3;
    --green-bg:#0a3d2a; --green-tc:#9FE1CB;
    --gray-bg:#2c2b27; --gray-tc:#B4B2A9;
    --ok:#9FE1CB; --ok-bg:#0a3d2a;
    --warn-bg:#3a2d00; --warn-tc:#F0D070; --warn-bd:#A08030;
  }}
  body{font-family:var(--font);background:var(--bg3);color:var(--text);min-height:100vh;}
  #root{max-width:680px;margin:0 auto;background:var(--bg);min-height:100vh;padding:16px;}
  input,select,button{font-family:var(--font);}
  input:focus,select:focus{outline:2px solid var(--blue);outline-offset:1px;}
  ::-webkit-scrollbar{width:4px;}::-webkit-scrollbar-track{background:transparent;}
  ::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px;}</style>
</head>
<body>
<div id="root"></div>

  var ds = parseTime(dayStartStr||DAY_START), cursor = ds;
  return (entries||[]).map(function(e) {
    var sm;
    if (e.startTime) {
      var anchor = parseTime(e.startTime);
      if (anchor < ds) anchor += 1440; // past-midnight entry
      sm = anchor >= cursor ? anchor : cursor; // never go backward
